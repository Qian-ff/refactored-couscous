name: A1 foundation checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: safelab
          POSTGRES_PASSWORD: ci-only-synthetic-password
          POSTGRES_DB: safelab
        ports: ['55432:5432']
        options: --health-cmd "pg_isready -U safelab -d safelab" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # 7.1.0
        with:
          node-version: '24.14.0'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # 6.1.0
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # 7.0.0
        with:
          python-version: '3.14.6'
      - run: pip install uv==0.13.1
      - run: pnpm install --frozen-lockfile
      - name: Local synthetic configuration
        run: |
          python others/scripts/setup_local.py
          python -c "from pathlib import Path; p=Path('.env'); s=p.read_text(); s='\n'.join('POSTGRES_PASSWORD=ci-only-synthetic-password' if v.startswith('POSTGRES_PASSWORD=') else 'DATABASE_URL=postgresql+psycopg://safelab:ci-only-synthetic-password@127.0.0.1:55432/safelab' if v.startswith('DATABASE_URL=') else v for v in s.splitlines()); p.write_text(s+'\n')"
      - run: uv sync --frozen --directory others/backend
      - name: Backend authorization and schema
        run: |
          uv run --directory others/backend pytest -q
          uv run --directory others/backend alembic upgrade head
          uv run --directory others/backend python -m app.seed
          pnpm check:contracts
      - run: pnpm build:web
      - run: python others/scripts/check_preparation.py
      - run: python -m unittest discover -s others/qa -p 'test_*.py' -v
