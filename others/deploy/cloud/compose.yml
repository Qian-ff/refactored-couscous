name: labconnect-cloud
x-api: &api
  image: ${API_IMAGE:?Set API_IMAGE in release.env}
  pull_policy: never
  env_file: /opt/labconnect/shared/api.env
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 1024m
  cpus: 1.3
  networks: [private, edge]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
services:
  db:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE in release.env}
    pull_policy: never
    env_file: /opt/labconnect/shared/db.env
    restart: unless-stopped
    mem_limit: 768m
    cpus: 0.7
    shm_size: 128m
    command: [postgres, -c, shared_buffers=128MB, -c, max_connections=40]
    volumes: [database:/var/lib/postgresql]
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  api:
    <<: *api
    environment:
      LABCONNECT_ASR_CONFIG: /run/labconnect-asr/client.json
      LABCONNECT_PLATFORM_AI_PROFILE: /opt/labconnect/others/runtime/ai/platform-ai.json
      LABCONNECT_CONTENT_RUNTIME: /run/labconnect-content/runtime.json
    command: [.venv/bin/python, -m, uvicorn, "app.main:app", --host, 0.0.0.0, --port, "8000", --proxy-headers, --forwarded-allow-ips, "*", --limit-concurrency, "12"]
    volumes:
      - files:/opt/labconnect/others/runtime/files
      - /opt/labconnect/shared/ai-master.key:/opt/labconnect/others/runtime/ai-master.key:ro
      - /opt/labconnect/shared/asr:/run/labconnect-asr:ro
      - /opt/labconnect/shared/ai:/opt/labconnect/others/runtime/ai:ro
      - content-files:/opt/labconnect/others/runtime/content
      - /opt/labconnect/shared/content-client:/run/labconnect-content:ro
    depends_on:
      db: {condition: service_healthy}
      content-control: {condition: service_healthy}
    healthcheck:
      test: [CMD, .venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  migrate:
    <<: *api
    profiles: [tools]
    restart: "no"
    # Only this management process receives the separate owner URL. api.env is runtime-only.
    env_file: [/opt/labconnect/shared/api.env, /opt/labconnect/shared/migration.env]
    command: [.venv/bin/python, -m, alembic, -c, alembic.ini, upgrade, head]
  content-manage:
    <<: *api
    profiles: [tools]
    user: "0:0"
    restart: "no"
    networks: [private]
    env_file: [/opt/labconnect/shared/api.env, /opt/labconnect/shared/migration.env]
    volumes: [/opt/labconnect/shared:/run/cloud-management]
    command: [.venv/bin/python, /opt/labconnect/others/deploy/cloud/content_setup.py, grant-check]
  content-control:
    image: ${CONTROL_IMAGE:?Set CONTROL_IMAGE in release.env}
    pull_policy: never
    restart: unless-stopped
    user: "0:0"
    read_only: true
    tmpfs: [/tmp]
    network_mode: none
    cap_drop: [ALL]
    # Read/clean the sandbox uid65532 output directories; only this trusted layer has Docker access.
    cap_add: [CHOWN, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.3
    pids_limit: 64
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/labconnect/shared/content-server:/run/content-server:ro
      - /opt/labconnect/shared/content-client:/run/labconnect-content
      - /opt/labconnect/shared/content-control:/opt/labconnect/shared/content-control
    healthcheck:
      test: [CMD, python, others/deploy/content/probe.py, --config, /run/labconnect-content/parser-client.json]
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 10s
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
  bootstrap:
    <<: *api
    profiles: [tools]
    restart: "no"
    env_file: [/opt/labconnect/shared/api.env, /opt/labconnect/shared/bootstrap.env]
    command: [.venv/bin/python, -m, app.cloud_bootstrap]
  web:
    image: ${WEB_IMAGE:?Set WEB_IMAGE in release.env}
    pull_policy: never
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set PUBLIC_HOST in shared/cloud.env}
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    mem_limit: 256m
    cpus: 0.5
    networks: [edge]
    volumes: [certificates:/data, caddy_config:/config]
    depends_on:
      api: {condition: service_healthy}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
networks:
  private: {internal: true}
  edge: {}
volumes:
  database: {name: labconnect_cloud_pg18}
  files: {name: labconnect_cloud_files}
  content-files: {name: labconnect_cloud_content}
  certificates: {name: labconnect_cloud_certificates}
  caddy_config: {name: labconnect_cloud_caddy_config}
