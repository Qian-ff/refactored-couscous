<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img"><title>废物泄漏教学场景</title><desc>原创实验室俯视示意，四个区域均有文字；非真实校园平面图。</desc><rect x="0" y="0" width="960" height="600" fill="#eef7f6" /><path d="M40 105 L920 105 L920 545 L40 545 Z" fill="#ffffff" stroke="#537b8a" stroke-width="4" /><text x="55" y="60" font-size="28" fill="#173f55">废物泄漏 · 场景观察</text><path d="M455 130 L455 520 M500 130 L500 520" stroke="#b5dcd8" stroke-width="3" /><rect x="80" y="145" width="350" height="145" rx="12" fill="#e0efef" stroke="#759fa9" stroke-width="2" /><rect x="112" y="173" width="60" height="60" rx="8" fill="#7db7ba" /><circle cx="142" cy="198" r="13" fill="#ffffff" /><text x="188" y="200" font-size="18" fill="#173f55">区域 1</text><text x="98" y="265" font-size="18" fill="#173f55">有标识的收集容器</text><rect x="530" y="145" width="350" height="145" rx="12" fill="#e0efef" stroke="#759fa9" stroke-width="2" /><rect x="562" y="173" width="60" height="60" rx="8" fill="#7db7ba" /><circle cx="592" cy="198" r="13" fill="#ffffff" /><text x="638" y="200" font-size="18" fill="#173f55">区域 2</text><text x="548" y="265" font-size="18" fill="#173f55">未知液体泄漏区域</text><rect x="80" y="355" width="350" height="145" rx="12" fill="#e0efef" stroke="#759fa9" stroke-width="2" /><rect x="112" y="383" width="60" height="60" rx="8" fill="#7db7ba" /><circle cx="142" cy="408" r="13" fill="#ffffff" /><text x="188" y="410" font-size="18" fill="#173f55">区域 3</text><text x="98" y="475" font-size="18" fill="#173f55">交接记录台</text><rect x="530" y="355" width="350" height="145" rx="12" fill="#e0efef" stroke="#759fa9" stroke-width="2" /><rect x="562" y="383" width="60" height="60" rx="8" fill="#7db7ba" /><circle cx="592" cy="408" r="13" fill="#ffffff" /><text x="638" y="410" font-size="18" fill="#173f55">区域 4</text><text x="548" y="475" font-size="18" fill="#173f55">收集用品准备区</text><ellipse cx="840" cy="235" rx="24" ry="13" fill="#84b4bb" /><text x="55" y="579" font-size="16" fill="#406878">教学草稿 · 依本地规程与教师审核使用</text></svg>