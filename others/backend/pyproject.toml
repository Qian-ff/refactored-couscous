[project]
name = "app"
version = "0.1.0"
description = "SafeLabPlatform shared API, adapted from FastAPI full-stack template 0.12.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi[standard]==0.141.1",
  "sqlmodel==0.0.39",
  "alembic==1.18.5",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "psycopg[binary]==3.3.4",
  "pyjwt==2.13.0",
  "pwdlib[argon2,bcrypt]==0.3.0",
  "uvicorn==0.49.0",
  "cryptography==50.0.2",
]

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.15.20"]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests", "app/domains"]
addopts = "--tb=short"

[tool.ruff]
target-version = "py314"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.fastapi]
entrypoint = "app.main:app"
